<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>My Studio 3.1</title><style>*{box-sizing:border-box}body{margin:0;background:#101114;color:white;font-family:-apple-system,BlinkMacSystemFont,'Apple SD Gothic Neo',sans-serif}main{max-width:590px;margin:auto;padding:22px 16px 80px}h1{font-size:32px}p,small{color:#adb0b8;line-height:1.55}section{background:#1e2026;border:1px solid #383b45;border-radius:16px;padding:17px;margin:16px 0}input,textarea,button{width:100%;font:inherit;border-radius:9px;padding:12px;margin:7px 0;border:1px solid #444752}input,textarea{background:#2b2d35;color:white}button{background:white;color:#111;font-weight:800}button:disabled{opacity:.45}.row{display:flex;gap:9px}.row>*{flex:1;min-width:0}.dark{background:#383b45;color:white}canvas{width:100%;aspect-ratio:4/5;border-radius:9px;background:#171717}#status{white-space:pre-wrap;color:#bce5c6}label{display:block;margin-top:10px;font-size:13px}</style></head><body><main><h1>My Studio <small>3.1</small></h1><p>인스타그램 링크 → 한국어 캐러셀 자동 제작</p><section><h3>① 게시물 링크 입력</h3><input id="link" placeholder="https://www.instagram.com/p/..." type="url"><small>공개 게시물 링크를 붙여넣으면 최대 10장의 이미지를 자동 수집합니다. 수집이 막힌 게시물은 아래에서 직접 사진을 선택하세요.</small><label>또는 원본 사진 선택 (선택사항)</label><input id="files" type="file" accept="image/png,image/jpeg,image/webp" multiple><button id="generate">AI로 한국어 캐러셀 생성</button><p id="status"></p></section><section><h3>② 미리보기 · 문구 수정</h3><div class="row"><button class="dark" id="prev">← 이전</button><button class="dark" id="next">다음 →</button></div><p id="counter">링크 또는 사진을 선택하세요</p><canvas id="canvas" width="1080" height="1350"></canvas><label>현재 장 한국어 문구</label><textarea id="text" rows="3"></textarea><label>워터마크</label><input id="mark" value="intheworldknow"><button id="download">완성본 ZIP 다운로드</button></section><section><h3>③ 한국어 캡션</h3><textarea id="caption" rows="8"></textarea><button class="dark" id="copy">캡션 복사</button></section><small>공개 게시물만 수집 가능하며 일부 링크는 제한될 수 있습니다. 원본 이미지 사용 권한과 번역 내용을 확인하세요. Apify/OpenAI API 비용이 발생할 수 있습니다.</small></main><script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script><script>
const $=id=>document.getElementById(id),c=$('canvas'),ctx=c.getContext('2d');let sources=[],slides=[],index=0,busy=false;
function load(src){return new Promise((ok,no)=>{let im=new Image;im.onload=()=>ok(im);im.onerror=()=>no(Error('이미지를 열 수 없습니다'));im.src=src})}
function dataUrl(file){return new Promise((ok,no)=>{const reader=new FileReader;reader.onload=()=>ok(reader.result);reader.onerror=no;reader.readAsDataURL(file)})}
async function shrink(src){let im=await load(src),can=document.createElement('canvas'),s=Math.min(1,1400/Math.max(im.width,im.height));can.width=Math.round(im.width*s);can.height=Math.round(im.height*s);can.getContext('2d').drawImage(im,0,0,can.width,can.height);return can.toDataURL('image/jpeg',.83)}
function lines(t,max=930){ctx.font='bold 65px -apple-system,Apple SD Gothic Neo,sans-serif';let out=[],line='';const tokens=String(t||'').split(/(\s+)/);for(let token of tokens){if(token.includes('\n')){for(const piece of token.split('\n')){if(piece!==token){if(line.trim())out.push(line.trim());line='';if(piece)line=piece;}else line+=piece}continue}if(!token)continue;if(ctx.measureText(line+token).width>max&&line.trim()){out.push(line.trim());line=token.trimStart()}else line+=token;if(ctx.measureText(line).width>max){let chunks=line.match(/.{1,13}/gu)||[line];out.push(...chunks.slice(0,-1));line=chunks.at(-1)}}if(line.trim())out.push(line.trim());return out.slice(0,7)}
function draw(){ctx.fillStyle='#111';ctx.fillRect(0,0,1080,1350);if(!slides.length)return;let s=slides[index],im=s.im,scale=Math.max(1080/im.width,1350/im.height),w=im.width*scale,h=im.height*scale;ctx.drawImage(im,(1080-w)/2,(1350-h)/2,w,h);let g=ctx.createLinearGradient(0,650,0,1350);g.addColorStop(0,'rgba(0,0,0,0)');g.addColorStop(1,'rgba(0,0,0,.94)');ctx.fillStyle=g;ctx.fillRect(0,650,1080,700);let arr=lines(s.text||'');ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillStyle='#fff';ctx.font='bold 65px -apple-system,Apple SD Gothic Neo,sans-serif';let lh=80,cy=1100-(arr.length-1)*lh/2;arr.forEach((line,i)=>ctx.fillText(line,540,cy+i*lh));ctx.font='bold 27px sans-serif';ctx.textAlign='right';ctx.shadowColor='#000';ctx.shadowBlur=8;ctx.fillText('@'+$('mark').value.replace(/^@/,''),1030,1305);ctx.shadowBlur=0}
function sync(){if(!slides.length)return;$('counter').textContent=`${index+1} / ${slides.length}장${index===0?' · 썸네일':''}`;$('text').value=slides[index].text;draw()}
$('files').onchange=async()=>{try{let fs=[...$('files').files].slice(0,10);sources=await Promise.all(fs.map(async f=>shrink(await dataUrl(f))));slides=await Promise.all(sources.map(async src=>({im:await load(src),text:''})));index=0;sync();$('status').textContent=`${sources.length}장 준비 완료`;}catch(e){$('status').textContent=e.message}};
async function post(url,payload){let r=await fetch(url,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(payload)});let j=await r.json().catch(()=>({}));if(!r.ok)throw Error(j.error||`서버 오류 ${r.status}`);return j}
async function fromInstagram(url){$('status').textContent='인스타그램 게시물 수집 중... (약 10~60초)';let result=await post('/api/instagram',{url});if(!result.images?.length)throw Error('수집된 이미지가 없습니다. 직접 업로드를 사용하세요.');let downloaded=[];for(let i=0;i<Math.min(10,result.images.length);i++){ $('status').textContent=`인스타그램 이미지 다운로드 ${i+1}/${Math.min(10,result.images.length)}...`;let r=await fetch('/api/instagram-image?url='+encodeURIComponent(result.images[i]));if(!r.ok)throw Error('이미지 다운로드 실패 ('+(i+1)+'장)');let blob=await r.blob();let data=await dataUrl(blob);downloaded.push(await shrink(data))}sources=downloaded;slides=await Promise.all(sources.map(async src=>({im:await load(src),text:''})));index=0;sync();return result.caption||''}
$('generate').onclick=async()=>{if(busy)return;busy=true;$('generate').disabled=true;try{let caption='';if(!sources.length){let url=$('link').value.trim();if(!url)return alert('인스타그램 링크를 넣거나 사진을 선택하세요');caption=await fromInstagram(url)}$('status').textContent='사진 내용을 분석하고 번역하는 중...';let result=await post('/api/analyze',{images:sources});$('caption').value=result.caption||caption||'';for(let i=0;i<sources.length;i++){slides[i].text=result.slides[i]?.text||'';index=i;sync();$('status').textContent=`${i+1}/${sources.length}장 AI 이미지 ${i===0?'썸네일 생성':'영어 제거'} 중...`;try{let edit=await post('/api/edit',{image:sources[i],prompt:result.slides[i]?.visualPrompt||'',cover:i===0});slides[i].im=await load(edit.image)}catch(e){$('status').textContent+=`\n${i+1}장 편집 실패: 원본 유지 (${e.message})`}sync()}index=0;sync();$('status').textContent='완료! 내용을 확인한 후 ZIP으로 저장하세요.'}catch(e){$('status').textContent='오류: '+e.message}finally{busy=false;$('generate').disabled=false}};
$('prev').onclick=()=>{if(slides.length){index=(index+slides.length-1)%slides.length;sync()}};$('next').onclick=()=>{if(slides.length){index=(index+1)%slides.length;sync()}};$('text').oninput=e=>{if(slides.length){slides[index].text=e.target.value;draw()}};$('mark').oninput=draw;
$('download').onclick=async()=>{if(!slides.length)return alert('사진을 선택하세요');if(!window.JSZip)return alert('ZIP 라이브러리를 불러오지 못했습니다');let zip=new JSZip(),old=index;for(let i=0;i<slides.length;i++){index=i;draw();let blob=await new Promise(ok=>c.toBlob(ok,'image/png'));zip.file(`slide_${String(i+1).padStart(2,'0')}.png`,blob)}zip.file('caption.txt',$('caption').value);zip.file('source_link.txt',$('link').value);index=old;sync();let blob=await zip.generateAsync({type:'blob'}),a=document.createElement('a'),url=URL.createObjectURL(blob);a.href=url;a.download='my-studio-3-carousel.zip';a.click();setTimeout(()=>URL.revokeObjectURL(url),30000)};
$('copy').onclick=async()=>{try{await navigator.clipboard.writeText($('caption').value);alert('복사 완료')}catch{alert('캡션을 길게 눌러 복사하세요')}};
</script></body></html>
